{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "continuityops-lab.secretName" . }}
  labels:
    {{- include "continuityops-lab.labels" . | nindent 4 }}
  annotations:
    continuityops.io/secret-source: chart-placeholder
    continuityops.io/warning: >-
      Do not commit real credentials. Populate via external secret manager or
      kubectl create secret before deploy.
type: Opaque
stringData:
  {{- range .Values.secret.keys }}
  {{ . }}: "REPLACE_VIA_EXTERNAL_SECRET_MANAGER"
  {{- end }}
{{- end }}
