name: Landing Zone lab (Terraform)

# Primary AWS path for the single-account LZ lab: GitHub OIDC → IAM role → Terraform.
# Do not use Cursor Cloud Agent assume-role for this workflow.

on:
  pull_request:
    paths:
      - 'project-a/sandbox/landing-zone-lab/**'
      - 'project-a/terraform/identity/**'
      - 'project-a/terraform/network/**'
      - 'project-a/terraform/audit/**'
      - '.github/workflows/landing-zone-lab.yml'
  push:
    branches: [main]
    paths:
      - 'project-a/sandbox/landing-zone-lab/**'
      - 'project-a/terraform/identity/**'
      - 'project-a/terraform/network/**'
      - 'project-a/terraform/audit/**'
      - '.github/workflows/landing-zone-lab.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: landing-zone-lab-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: 'false'
  # Override with repo variable AWS_LZLAB_ROLE_ARN after github-oidc bootstrap.
  AWS_LZLAB_ROLE_ARN: ${{ vars.AWS_LZLAB_ROLE_ARN || 'arn:aws:iam::283077380808:role/GitHubActionsLZLab' }}
  LAB_DIR: project-a/sandbox/landing-zone-lab
  TF_VERSION: '1.15.5'

jobs:
  plan:
    name: Terraform plan (lab)
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: project-a/sandbox/landing-zone-lab/lab
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@a18301f325db48595b0bf65205414f377d4c4896 # v4
        with:
          role-to-assume: ${{ env.AWS_LZLAB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-lzlab-plan-${{ github.run_id }}

      - name: Verify caller (non-root)
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          case "$ARN" in *[:/]root) echo "refusing root"; exit 2 ;; esac
          case "$ARN" in *GitHubActionsLZLab*|*assumed-role*) ;; *)
            echo "warning: unexpected caller $ARN" >&2 ;;
          esac

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced21036225 # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Ensure remote state config
        working-directory: project-a/sandbox/landing-zone-lab
        run: |
          set -euo pipefail
          if [[ ! -f lab/backend.hcl ]]; then
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            printf '%s\n' \
              "bucket       = \"project-a-lzlab-tfstate-${ACCOUNT}\"" \
              'key          = "lab/landing-zone-lab.tfstate"' \
              "region       = \"${AWS_REGION}\"" \
              'encrypt      = true' \
              'use_lockfile = true' \
              > lab/backend.hcl
            echo "Wrote lab/backend.hcl (expects state-bootstrap bucket already applied)"
            cat lab/backend.hcl
          fi

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -input=false -reconfigure

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lzlab-tfplan-${{ github.run_id }}
          path: |
            project-a/sandbox/landing-zone-lab/lab/tfplan
            project-a/sandbox/landing-zone-lab/lab/plan.txt
          if-no-files-found: warn

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const fs = require('fs');
            const path = 'project-a/sandbox/landing-zone-lab/lab/plan.txt';
            let body = '## Landing Zone lab — Terraform plan\n\n';
            if (fs.existsSync(path)) {
              const text = fs.readFileSync(path, 'utf8');
              const clipped = text.length > 60000 ? text.slice(0, 60000) + '\n…truncated…' : text;
              body += '```\n' + clipped + '\n```\n';
            } else {
              body += '_plan.txt missing_\n';
            }
            body += `\nRole: \`${process.env.AWS_LZLAB_ROLE_ARN}\`\n`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  apply:
    name: Terraform apply (lab)
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: landing-zone-lab
    defaults:
      run:
        working-directory: project-a/sandbox/landing-zone-lab/lab
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@a18301f325db48595b0bf65205414f377d4c4896 # v4
        with:
          role-to-assume: ${{ env.AWS_LZLAB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-lzlab-apply-${{ github.run_id }}

      - name: Verify caller (non-root)
        run: |
          set -euo pipefail
          aws sts get-caller-identity | tee "$RUNNER_TEMP/sts.json"
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          case "$ARN" in *[:/]root) echo "refusing root"; exit 2 ;; esac

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced21036225 # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Ensure remote state config
        working-directory: project-a/sandbox/landing-zone-lab
        run: |
          set -euo pipefail
          if [[ ! -f lab/backend.hcl ]]; then
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            printf '%s\n' \
              "bucket       = \"project-a-lzlab-tfstate-${ACCOUNT}\"" \
              'key          = "lab/landing-zone-lab.tfstate"' \
              "region       = \"${AWS_REGION}\"" \
              'encrypt      = true' \
              'use_lockfile = true' \
              > lab/backend.hcl
          fi

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl -input=false -reconfigure

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Capture CLI evidence
        working-directory: project-a/sandbox/landing-zone-lab
        run: |
          set -euo pipefail
          bash ./capture-evidence.sh ./EVIDENCE.capture.md
          bash ./render-evidence.sh ./EVIDENCE.capture.md ./EVIDENCE.md

      - name: Upload evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lzlab-evidence-${{ github.run_id }}
          path: |
            project-a/sandbox/landing-zone-lab/EVIDENCE.md
            project-a/sandbox/landing-zone-lab/EVIDENCE.capture.md

      - name: Commit evidence to main
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-a/sandbox/landing-zone-lab/EVIDENCE.md
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
            exit 0
          fi
          git commit -m "docs(lab): update EVIDENCE.md from GitHub OIDC apply (${{ github.run_id }})"
          git push origin HEAD:main
