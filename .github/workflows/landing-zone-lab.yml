name: Landing Zone lab (Terraform)

# Pull requests are credential-free. The only live path is a protected,
# manually dispatched plan using GitHub OIDC.

on:
  pull_request:
    paths:
      - 'platform/sandbox/landing-zone-lab/**'
      - 'platform/terraform/identity/**'
      - 'platform/terraform/network/**'
      - 'platform/terraform/audit/**'
      - '.github/workflows/landing-zone-lab.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Protected live plan
        required: true
        default: plan
        type: choice
        options:
          - plan

permissions:
  contents: read

concurrency:
  group: landing-zone-lab-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: '1'
  TF_INPUT: 'false'

jobs:
  offline-validation:
    name: Credential-free Terraform validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Validate Terraform without AWS credentials
        shell: pwsh
        run: ./platform/scripts/validate-project-a.ps1

  protected-plan:
    name: Protected live Terraform plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: lab
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_LZ_LAB || 'arn:aws:iam::<AWS_ACCOUNT_ID>:role/project-a-lzlab-gha' }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-lzlab-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Plan lab without mutation
        run: bash ./platform/sandbox/landing-zone-lab/plan-lab.sh
