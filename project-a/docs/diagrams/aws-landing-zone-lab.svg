<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1480" viewBox="0 0 1100 1480" role="img" aria-labelledby="t d">
  <title id="t">AWS Landing Zone Lab</title>
  <desc id="d">One figure: platform architecture, how the live lab works, and private network detail. Orgs design-only; live lab is single-account.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#243B53"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#205493"/></marker>
  </defs>
  <rect width="1100" height="1480" fill="#EEF2F6"/>
  <rect x="24" y="24" width="1052" height="1432" rx="10" fill="#FFFFFF" stroke="#243B53" stroke-width="2"/>

  <text x="56" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2933">AWS Landing Zone Lab</text>
  <text x="56" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#52606D">Architecture · How it works · Private network</text>

  <!-- ===== A Architecture ===== -->
  <text x="56" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933">A. Architecture (platform contract)</text>

  <rect x="56" y="170" width="180" height="78" rx="10" fill="#D9E2EC" stroke="#243B53" stroke-width="2"/>
  <text x="146" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">1. Bootstrap</text>
  <text x="146" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334E68">State / secrets</text>

  <line x1="236" y1="209" x2="268" y2="209" stroke="#243B53" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="276" y="170" width="200" height="78" rx="10" fill="#E8DCBF" stroke="#7C5E10" stroke-width="2"/>
  <text x="376" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#513C06">2. Organization</text>
  <text x="376" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#7C5E10">Accounts / OUs / SCPs (design)</text>

  <line x1="476" y1="209" x2="508" y2="209" stroke="#243B53" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="516" y="170" width="180" height="78" rx="10" fill="#D9F2E6" stroke="#18794E" stroke-width="2"/>
  <text x="606" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B3D2E">3. Identity</text>
  <text x="606" y="222" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#18794E">IAM + OIDC trust</text>

  <rect x="56" y="278" width="180" height="78" rx="10" fill="#F9D6BF" stroke="#8D2B0B" stroke-width="2"/>
  <text x="146" y="308" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#8D2B0B">4. Network</text>
  <text x="146" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8D2B0B">Private VPC boundary</text>

  <line x1="236" y1="317" x2="268" y2="317" stroke="#243B53" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="276" y="278" width="200" height="78" rx="10" fill="#D8E8FF" stroke="#1D4D8F" stroke-width="2"/>
  <text x="376" y="308" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1D4D8F">5. Audit</text>
  <text x="376" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1D4D8F">CloudTrail / Config / KMS</text>

  <line x1="476" y1="317" x2="508" y2="317" stroke="#243B53" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="516" y="278" width="180" height="78" rx="10" fill="#EFE3FF" stroke="#653CAD" stroke-width="2"/>
  <text x="606" y="308" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#653CAD">6. Validation</text>
  <text x="606" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#653CAD">Tests, runbooks, claims</text>

  <rect x="720" y="170" width="320" height="186" rx="10" fill="#F0F4F8" stroke="#627D98" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="880" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#243B53">Live lab (one account)</text>
  <text x="880" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#18794E"> Identity</text>
  <text x="880" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A6D1D"> Private network</text>
  <text x="880" y="296" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1D4D8F"> Audit</text>
  <text x="880" y="330" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B0000">Orgs members = design only</text>

  <!-- ===== B How it works ===== -->
  <text x="56" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933">B. How the live lab works</text>

  <rect x="56" y="430" width="150" height="110" rx="10" fill="#E3E8EE" stroke="#243B53" stroke-width="2"/>
  <text x="131" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">1. You push code</text>
  <text x="131" y="496" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#334E68">GitHub Actions</text>

  <line x1="206" y1="485" x2="230" y2="485" stroke="#243B53" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="238" y="430" width="160" height="110" rx="10" fill="#D9F2E6" stroke="#18794E" stroke-width="2"/>
  <text x="318" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B3D2E">2. GitHub proves</text>
  <text x="318" y="480" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B3D2E">who you are</text>
  <text x="318" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#18794E">OIDC, no long-lived keys</text>

  <line x1="398" y1="485" x2="422" y2="485" stroke="#243B53" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="430" y="430" width="160" height="110" rx="10" fill="#D8E8FF" stroke="#1D4D8F" stroke-width="2"/>
  <text x="510" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#102A43">3. Terraform builds</text>
  <text x="510" y="480" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#102A43">the lab</text>
  <text x="510" y="508" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1D4D8F">single AWS account</text>

  <line x1="590" y1="485" x2="614" y2="485" stroke="#243B53" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="622" y="420" width="200" height="130" rx="10" fill="#F5F7FA" stroke="#243B53" stroke-width="2"/>
  <text x="722" y="444" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#102A43">4. Live in us-east-1</text>
  <text x="722" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#18794E">Identity (OIDC role)</text>
  <text x="722" y="492" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8A6D1D">Private network (VPC)</text>
  <text x="722" y="514" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1D4D8F">Audit (CloudTrail + KMS)</text>

  <line x1="822" y1="485" x2="846" y2="485" stroke="#243B53" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="854" y="430" width="180" height="110" rx="10" fill="#E8DCBF" stroke="#7C5E10" stroke-width="2"/>
  <text x="944" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#513C06">5. Evidence written</text>
  <text x="944" y="492" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#513C06">down</text>
  <text x="944" y="518" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#7C5E10">docs + CI proofs</text>

  <!-- ===== C Network ===== -->
  <text x="56" y="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933">C. Private network detail</text>

  <rect x="56" y="620" width="700" height="280" rx="12" fill="#E8F1FB" stroke="#205493" stroke-width="2"/>
  <text x="80" y="654" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">Network account · VPC (RFC 1918)</text>

  <rect x="80" y="680" width="260" height="120" rx="8" fill="#D9F2E6" stroke="#18794E" stroke-width="2"/>
  <text x="210" y="724" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B3D2E">Private subnet A</text>
  <text x="210" y="752" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#18794E">No public IPs</text>

  <rect x="380" y="680" width="260" height="120" rx="8" fill="#D9F2E6" stroke="#18794E" stroke-width="2"/>
  <text x="510" y="724" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B3D2E">Private subnet B</text>
  <text x="510" y="752" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#18794E">No default route</text>

  <text x="80" y="840" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#102A43">Default-deny SG (ingress/egress empty)</text>
  <text x="80" y="870" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B0000">No internet, NAT, peering, Transit Gateway, or cross-account route</text>

  <line x1="756" y1="740" x2="820" y2="740" stroke="#205493" stroke-width="3" marker-end="url(#arr2)"/>
  <text x="760" y="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#205493">Flow Logs ’</text>

  <rect x="830" y="620" width="200" height="70" rx="8" fill="#D8E8FF" stroke="#1D4D8F" stroke-width="2"/>
  <text x="930" y="650" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1D4D8F">Security Tooling</text>
  <text x="930" y="672" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1D4D8F">trail / Config path</text>

  <rect x="830" y="720" width="200" height="100" rx="8" fill="#FFF4CE" stroke="#8A6D1D" stroke-width="2"/>
  <text x="930" y="760" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#513C06">Log Archive</text>
  <text x="930" y="786" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8A6D1D">owns protected S3</text>

  <!-- Caption -->
  <rect x="56" y="940" width="984" height="56" rx="8" fill="#1F2933"/>
  <text x="548" y="974" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF">Not production. Not multi-account live. Honest single-account lab via Terraform + GitHub OIDC.</text>

  <!-- ELI5 strip -->
  <text x="56" y="1040" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1F2933">Plain English</text>
  <text x="56" y="1070" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#334E68">A = the platform pieces on paper. B = how CI builds the live lab. C = the private VPC has no path to the internet;</text>
  <text x="56" y="1092" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#334E68">flow logs go to a locked Log Archive bucket. Multi-account Orgs/OU/SCP stay design-only.</text>

  <text x="56" y="1140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#627D98">Editable sources: aws-landing-zone-lab.drawio · section sources also kept as architecture / how-it-works / network assets.</text>
</svg>
