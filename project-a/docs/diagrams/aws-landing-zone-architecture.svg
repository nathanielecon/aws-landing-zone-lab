<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d">
  <title id="t">AWS Landing Zone Architecture</title>
  <desc id="d">Six-box platform contract: Bootstrap, Organization, Identity, Network, Audit, Validation. Orgs design-only; live lab applied identity network audit in one account.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#243B53"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#EEF2F6"/>
  <rect x="28" y="28" width="1044" height="504" rx="8" fill="#FFFFFF" stroke="#243B53" stroke-width="2"/>

  <text x="56" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2933">AWS Landing Zone Architecture</text>
  <text x="56" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#52606D">Multi-account design (on paper) + what the live lab actually applied</text>

  <rect x="56" y="140" width="200" height="100" rx="12" fill="#D9E2EC" stroke="#243B53" stroke-width="2"/>
  <text x="156" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#102A43">1. Bootstrap</text>
  <text x="156" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334E68">State backend &amp; secrets</text>

  <line x1="256" y1="190" x2="298" y2="190" stroke="#243B53" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="306" y="140" width="220" height="100" rx="12" fill="#E8DCBF" stroke="#7C5E10" stroke-width="2"/>
  <text x="416" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#513C06">2. Organization</text>
  <text x="416" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#7C5E10">Accounts, OUs, SCPs (design)</text>

  <line x1="526" y1="190" x2="568" y2="190" stroke="#243B53" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="576" y="140" width="200" height="100" rx="12" fill="#D9F2E6" stroke="#18794E" stroke-width="2"/>
  <text x="676" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B3D2E">3. Identity</text>
  <text x="676" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#18794E">IAM policies &amp; OIDC trust</text>

  <line x1="156" y1="240" x2="156" y2="290" stroke="#243B53" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="676" y1="240" x2="676" y2="290" stroke="#243B53" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="56" y="300" width="200" height="100" rx="12" fill="#F9D6BF" stroke="#8D2B0B" stroke-width="2"/>
  <text x="156" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#8D2B0B">4. Network</text>
  <text x="156" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8D2B0B">Private VPC boundary</text>

  <line x1="256" y1="350" x2="298" y2="350" stroke="#243B53" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="306" y="300" width="220" height="100" rx="12" fill="#D8E8FF" stroke="#1D4D8F" stroke-width="2"/>
  <text x="416" y="340" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D4D8F">5. Audit</text>
  <text x="416" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1D4D8F">CloudTrail, Config, KMS logs</text>

  <line x1="526" y1="350" x2="568" y2="350" stroke="#243B53" stroke-width="3" marker-end="url(#arr)"/>

  <rect x="576" y="300" width="200" height="100" rx="12" fill="#EFE3FF" stroke="#653CAD" stroke-width="2"/>
  <text x="676" y="336" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#653CAD">6. Validation</text>
  <text x="676" y="358" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#653CAD">&amp; Evidence</text>
  <text x="676" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#653CAD">Tests, runbooks, claims</text>

  <rect x="820" y="140" width="220" height="260" rx="12" fill="#F0F4F8" stroke="#627D98" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="930" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#243B53">Live lab (one account)</text>
  <text x="930" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#18794E"> Identity</text>
  <text x="930" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8A6D1D"> Private network</text>
  <text x="930" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1D4D8F"> Audit</text>
  <text x="930" y="304" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">us-east-1 via</text>
  <text x="930" y="324" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">GitHub OIDC CI</text>
  <text x="930" y="360" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8B0000">Orgs members: not created</text>

  <rect x="56" y="440" width="984" height="56" rx="8" fill="#1F2933"/>
  <text x="548" y="474" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#FFFFFF">Orgs member accounts = design only. Live lab applied Identity + Network + Audit in one account.</text>
</svg>
