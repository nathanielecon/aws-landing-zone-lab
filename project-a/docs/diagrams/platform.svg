<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <rect width="960" height="560" fill="#f5f1e8"/>
  <rect x="40" y="40" width="880" height="480" rx="24" fill="#fffaf0" stroke="#3b3a36" stroke-width="2"/>
  <text x="70" y="85" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#1f2933">AWS Landing Zone Architecture (legacy SVG)</text>
  <text x="70" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#52606d">Foundation (A-001…A-007): repo-only multi-account design — not multi-account cloud-validated</text>
  <text x="70" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#52606d">Separate single-account lab (sandbox/landing-zone-lab): APPLIED identity+network+audit only — not Orgs members</text>

  <rect x="90" y="175" width="180" height="110" rx="16" fill="#d9e2ec" stroke="#243b53" stroke-width="2"/>
  <text x="120" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#102a43">Bootstrap</text>
  <text x="118" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#334e68">Backend and secrets</text>

  <rect x="310" y="175" width="180" height="110" rx="16" fill="#e8dcbf" stroke="#7c5e10" stroke-width="2"/>
  <text x="330" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#513c06">Organization</text>
  <text x="334" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7c5e10">Accounts and OUs</text>

  <rect x="530" y="175" width="180" height="110" rx="16" fill="#d9f0e1" stroke="#1f5130" stroke-width="2"/>
  <text x="580" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1f5130">Identity</text>
  <text x="562" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1f5130">Policies and trust</text>

  <rect x="90" y="335" width="180" height="110" rx="16" fill="#f9d6bf" stroke="#8d2b0b" stroke-width="2"/>
  <text x="133" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#8d2b0b">Network</text>
  <text x="112" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8d2b0b">Private-only boundary</text>

  <rect x="310" y="335" width="180" height="110" rx="16" fill="#d8e8ff" stroke="#1d4d8f" stroke-width="2"/>
  <text x="357" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#1d4d8f">Audit</text>
  <text x="330" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1d4d8f">CloudTrail, Config, logs</text>

  <rect x="530" y="335" width="260" height="110" rx="16" fill="#efe3ff" stroke="#653cad" stroke-width="2"/>
  <text x="565" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#653cad">Validation and Evidence</text>
  <text x="562" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#653cad">Tests, runbooks, claims boundary</text>

  <line x1="270" y1="230" x2="310" y2="230" stroke="#243b53" stroke-width="3"/>
  <line x1="490" y1="230" x2="530" y2="230" stroke="#243b53" stroke-width="3"/>
  <line x1="620" y1="285" x2="620" y2="335" stroke="#243b53" stroke-width="3"/>
  <line x1="180" y1="285" x2="180" y2="335" stroke="#243b53" stroke-width="3"/>
  <line x1="270" y1="390" x2="310" y2="390" stroke="#243b53" stroke-width="3"/>
  <line x1="490" y1="390" x2="530" y2="390" stroke="#243b53" stroke-width="3"/>

  <text x="70" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#627d98">Caption: diagram boxes describe the repo-only foundation contract. Lab APPLIED status is separate and does not imply multi-account cloud validation.</text>
</svg>
