<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Project A  AWS Landing Zone Lab</title>
  <desc id="d">Plain-English flow: push code, OIDC trust, Terraform builds one account, live identity network and audit, then evidence. Multi-account Orgs remain design-only.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#243B53"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#EEF2F6"/>
  <rect x="24" y="24" width="1152" height="472" rx="8" fill="#FFFFFF" stroke="#243B53" stroke-width="2"/>

  <text x="56" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2933">Project A  AWS Landing Zone Lab</text>
  <text x="56" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#52606D">What got built, in plain English</text>

  <!-- 1 -->
  <rect x="56" y="140" width="170" height="96" rx="12" fill="#E3E8EE" stroke="#243B53" stroke-width="2"/>
  <text x="141" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#102A43">1. You push code</text>
  <text x="141" y="204" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#334E68">GitHub Actions</text>

  <line x1="226" y1="188" x2="258" y2="188" stroke="#243B53" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2 -->
  <rect x="266" y="140" width="190" height="96" rx="12" fill="#D9F2E6" stroke="#18794E" stroke-width="2"/>
  <text x="361" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B3D2E">2. GitHub proves</text>
  <text x="361" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B3D2E">who you are</text>
  <text x="361" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#18794E">OIDC trust</text>

  <line x1="456" y1="188" x2="488" y2="188" stroke="#243B53" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 3 -->
  <rect x="496" y="140" width="190" height="96" rx="12" fill="#D8E8FF" stroke="#1D4D8F" stroke-width="2"/>
  <text x="591" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">3. Terraform builds</text>
  <text x="591" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">the lab</text>
  <text x="591" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1D4D8F">Single AWS account</text>

  <line x1="686" y1="188" x2="718" y2="188" stroke="#243B53" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4 Live group -->
  <rect x="726" y="120" width="230" height="250" rx="12" fill="#F5F7FA" stroke="#243B53" stroke-width="2"/>
  <text x="841" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#102A43">4. Live in us-east-1</text>

  <rect x="746" y="164" width="190" height="52" rx="8" fill="#D9F2E6" stroke="#18794E" stroke-width="1.5"/>
  <text x="841" y="186" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B3D2E">Identity</text>
  <text x="841" y="204" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#18794E">OIDC / workload role</text>

  <rect x="746" y="226" width="190" height="52" rx="8" fill="#FFF4CE" stroke="#8A6D1D" stroke-width="1.5"/>
  <text x="841" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#513C06">Private network</text>
  <text x="841" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8A6D1D">VPC + flow logs</text>

  <rect x="746" y="288" width="190" height="52" rx="8" fill="#D8E8FF" stroke="#1D4D8F" stroke-width="1.5"/>
  <text x="841" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#102A43">Audit</text>
  <text x="841" y="328" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1D4D8F">CloudTrail + KMS logs</text>

  <line x1="976" y1="245" x2="1008" y2="245" stroke="#243B53" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 5 -->
  <rect x="1016" y="190" width="140" height="110" rx="12" fill="#E8DCBF" stroke="#7C5E10" stroke-width="2"/>
  <text x="1086" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#513C06">5. Evidence</text>
  <text x="1086" y="248" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#513C06">written down</text>
  <text x="1086" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#7C5E10">Docs + CI proofs</text>

  <!-- Design-only -->
  <rect x="56" y="280" width="420" height="88" rx="10" fill="#F0F4F8" stroke="#627D98" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="76" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#243B53">Also in the repo (design only)</text>
  <text x="76" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">Multi-account Orgs / OU / SCP interfaces.</text>
  <text x="76" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">Member accounts were not created in the live lab.</text>

  <!-- Caption bar -->
  <rect x="56" y="420" width="1100" height="44" rx="8" fill="#1F2933"/>
  <text x="606" y="448" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF">Multi-account Orgs/OU/SCP = design only. Live lab = one account. No production claim.</text>
</svg>
