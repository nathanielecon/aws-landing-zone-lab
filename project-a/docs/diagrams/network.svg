<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280" role="img" aria-labelledby="title desc">
  <title id="title">Network account private VPC boundary</title>
  <desc id="desc">Network account owns the VPC, private subnets, and default-deny security group. Flow Logs emit to Log Archive, which owns protected S3 storage. No internet or cross-account connection is shown.</desc>
  <rect width="760" height="280" fill="#ffffff"/>
  <rect x="30" y="35" width="510" height="205" rx="12" fill="#e8f1fb" stroke="#205493" stroke-width="2"/>
  <text x="55" y="65" font-family="Arial" font-size="18" fill="#102a43">Network account · VPC (RFC 1918)</text>
  <rect x="60" y="90" width="195" height="100" rx="8" fill="#d9f2e6" stroke="#18794e"/>
  <text x="80" y="118" font-family="Arial" font-size="16">Private subnet A</text>
  <text x="80" y="145" font-family="Arial" font-size="13">No public IPs</text>
  <rect x="295" y="90" width="195" height="100" rx="8" fill="#d9f2e6" stroke="#18794e"/>
  <text x="315" y="118" font-family="Arial" font-size="16">Private subnet B</text>
  <text x="315" y="145" font-family="Arial" font-size="13">No default route</text>
  <text x="60" y="215" font-family="Arial" font-size="13" fill="#102a43">Default-deny SG (ingress/egress empty)</text>
  <path d="M540 137 H630" stroke="#205493" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="545" y="118" font-family="Arial" font-size="12">Flow Logs →</text>
  <rect x="635" y="95" width="100" height="85" rx="8" fill="#fff4ce" stroke="#8a6d1d"/>
  <text x="648" y="125" font-family="Arial" font-size="13">Log Archive</text>
  <text x="645" y="145" font-family="Arial" font-size="11">owns storage</text>
  <text x="668" y="163" font-family="Arial" font-size="11">S3</text>
  <text x="60" y="245" font-family="Arial" font-size="12" fill="#8b0000">No internet, NAT, peering, Transit Gateway, or cross-account route</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#205493"/></marker></defs>
</svg>
