<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Network account private VPC boundary</title>
  <desc id="desc">Network account owns the VPC, private subnets, and default-deny security group. Flow Logs emit to Log Archive, which owns protected S3 storage. Security Tooling owns trail and Config path interfaces that share that archive. No internet or cross-account connection is shown.</desc>
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="30" y="45" width="500" height="205" rx="12" fill="#e8f1fb" stroke="#205493" stroke-width="2"/>
  <text x="55" y="75" font-family="Arial" font-size="18" fill="#102a43">Network account · VPC (RFC 1918)</text>
  <rect x="60" y="100" width="195" height="100" rx="8" fill="#d9f2e6" stroke="#18794e"/>
  <text x="80" y="128" font-family="Arial" font-size="16">Private subnet A</text>
  <text x="80" y="155" font-family="Arial" font-size="13">No public IPs</text>
  <rect x="295" y="100" width="195" height="100" rx="8" fill="#d9f2e6" stroke="#18794e"/>
  <text x="315" y="128" font-family="Arial" font-size="16">Private subnet B</text>
  <text x="315" y="155" font-family="Arial" font-size="13">No default route</text>
  <text x="60" y="225" font-family="Arial" font-size="13" fill="#102a43">Default-deny SG (ingress/egress empty)</text>
  <path d="M530 147 H620" stroke="#205493" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="535" y="128" font-family="Arial" font-size="12">Flow Logs →</text>
  <rect x="625" y="30" width="115" height="52" rx="8" fill="#d8e8ff" stroke="#1d4d8f"/>
  <text x="638" y="50" font-family="Arial" font-size="12" fill="#1d4d8f">Security Tooling</text>
  <text x="640" y="68" font-family="Arial" font-size="10" fill="#1d4d8f">trail/Config path</text>
  <rect x="625" y="100" width="115" height="85" rx="8" fill="#fff4ce" stroke="#8a6d1d"/>
  <text x="640" y="130" font-family="Arial" font-size="13">Log Archive</text>
  <text x="637" y="150" font-family="Arial" font-size="11">owns storage</text>
  <text x="668" y="168" font-family="Arial" font-size="11">S3</text>
  <text x="60" y="275" font-family="Arial" font-size="12" fill="#8b0000">No internet, NAT, peering, Transit Gateway, or cross-account route</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#205493"/></marker></defs>
</svg>
